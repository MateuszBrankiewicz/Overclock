name: CD (Container Delivery & Release)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish OCI Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------ Backend Container --
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------- Frontend Container --
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test-deployment:
    name: Container Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-publish]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start local stack with docker compose
        run: docker compose up -d --build

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            BACKEND_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health || true)
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            echo "Attempt $i: Backend HTTP $BACKEND_HEALTH, Frontend HTTP $FRONTEND_STATUS"
            if [ "$BACKEND_HEALTH" = "200" ] && [ "$FRONTEND_STATUS" = "200" ]; then
              echo "✅ Both Backend and Frontend containers are healthy and responding!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Smoke test timed out waiting for healthy services."
          docker compose logs
          exit 1

      - name: Tear down local stack
        if: always()
        run: docker compose down -v
