name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Architecture harness (full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Docker is preinstalled on ubuntu-latest, so Testcontainers works out of the box.
      - name: Full verification (docs, format, build, arch, integration, frontend, codegen drift)
        run: bash scripts/verify.sh

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          for sha in $(git rev-list "origin/${{ github.base_ref }}..HEAD" --no-merges); do
            git log -1 --format=%B "$sha" > /tmp/msg
            bash .githooks/commit-msg /tmp/msg
          done
