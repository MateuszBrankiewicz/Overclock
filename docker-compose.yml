services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=overclock;Username=overclock;Password=overclock_secret
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - overclock-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - overclock-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: overclock
      POSTGRES_USER: overclock
      POSTGRES_PASSWORD: overclock_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overclock -d overclock"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - overclock-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - overclock-net

volumes:
  postgres_data:
  redis_data:

networks:
  overclock-net:
    driver: bridge
