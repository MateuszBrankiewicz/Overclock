# Real client IP behind Tailscale Funnel (alternative to nginx-real-ip.conf, which assumes Cloudflare).
# Funnel forwards requests from the local tailscaled (loopback, or the Docker bridge gateway when the
# port is published), adding the player's address to X-Forwarded-For. That header is trusted only from
# those local sources, and real_ip_recursive makes nginx take the right-most address that is not trusted,
# so a value the client put at the front of X-Forwarded-For cannot be used to spoof its IP.
# Select it with REAL_IP_CONF=./frontend/nginx-real-ip-tailscale.conf in .env.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from ::1/128;
set_real_ip_from fc00::/7;
