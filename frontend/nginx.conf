server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;

    server_tokens off;

    # Security headers (CSP, HSTS, framing, sniffing). HSTS only takes effect when this server is reached
    # over HTTPS, e.g. behind a TLS-terminating proxy — browsers ignore it on plain HTTP.
    include /etc/nginx/snippets/security-headers.conf;

    # $remote_addr becomes the player's IP (see the snippet); the backend reads it from X-Forwarded-For.
    include /etc/nginx/snippets/real-ip.conf;

    # SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and SignalR hub requests to backend service if in Docker network
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hub/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://backend:5000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://backend:5000/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static assets cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
